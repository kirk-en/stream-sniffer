<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Stream Sniffer Player</title>
  <link rel="stylesheet" href="style.css">
</head>
<body class="player">
  <!-- Two video elements: one fills the tab, the other floats small on top. Clicking the small
       one swaps them. Each keeps its own stream, so a swap reloads nothing. -->
  <!-- No Chrome controls: the page can't add to them, and their fullscreen shows only the video
       (hiding the small picture and messages). #bar replaces them. -->
  <video class="big" playsinline></video>
  <video class="small" playsinline hidden></video>
  <!-- Follows the small picture around (a video element can't hold children). -->
  <button id="hide-small" type="button" hidden aria-label="Hide the small picture" title="Hide the small picture; it keeps playing (H)">–</button>
  <button id="remove-small" type="button" hidden aria-label="Remove the small stream" title="Remove the small stream">×</button>

  <!-- The big picture's controls. Fades out, like Chrome's, once the mouse rests. -->
  <div id="bar" hidden>
    <button id="play" type="button" class="icon" aria-label="Play" title="Play" hidden></button>
    <button id="mute" type="button" class="icon" aria-label="Mute" title="Mute (M)"></button>
    <input id="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume" title="Volume">
    <button id="live" type="button" title="Jump to live"></button>
    <span id="time"></span>
    <span class="spacer"></span>
    <button id="show-small" type="button" hidden title="Show the small picture again (H)">Show small picture</button>
    <div id="quality-wrap">
      <button id="quality" type="button" aria-haspopup="menu" aria-expanded="false" title="Quality"><span id="resolution"></span><span id="bitrate"></span></button>
      <div id="quality-menu" role="menu" hidden></div>
    </div>
    <button id="popout" type="button" class="icon" aria-label="Pop out" title="Pop out: play in a floating window that stays on top"></button>
    <button id="fullscreen" type="button" class="icon" aria-label="Full screen" title="Full screen (F, or double-click the video)"></button>
  </div>

  <!-- Errors and buffering, over the video, only while something is wrong. -->
  <!-- What the detector found: boxes over the scorebug and logo (Draw boxes). -->
  <div id="overlay-boxes"></div>
  <!-- How much of the picture is the field now (Show the field share). -->
  <div id="field-meter" hidden></div>
  <!-- Top left: problems, then the ad-break log. -->
  <div id="top-left">
    <div id="problems"></div>
    <!-- While the detector is on: learning starts only from here (or the menu), never by itself. -->
    <button id="learn-btn" type="button" class="learn" hidden data-tip="Press during normal play: the detector needs about 30 seconds of the game with the scorebug and the network logo on screen. Not during a commercial, a replay or halftime.">🧠 Learn scorebug &amp; logo</button>
    <!-- Ad-break cues and is_commercial changes as they come. Stays up until closed. -->
    <div id="cues" hidden>
      <p class="head"><span>Ad breaks <span id="cue-count"></span></span><span id="detect-state" class="state" hidden></span><button id="cues-close" type="button" class="dismiss" aria-label="Close" title="Close (the cues stay in Copy log)">×</button></p>
      <ol id="cue-list"></ol>
    </div>
  </div>

  <button id="settings" type="button" aria-label="Settings" aria-expanded="false" title="Settings">⚙</button>
  <div id="menu" hidden>
    <div id="streams"></div>
    <label class="toggle"><input id="frame-warnings" type="checkbox" checked> Warn about lost frames and refresh-rate hitches</label>
    <!-- Folds away; the player remembers whether it was left open. -->
    <details id="commercial-detection">
      <summary class="muted small">Commercial detection (experimental)</summary>
      <div class="detect">
        <!-- Ad-break markers go to the freeze log (Copy log); see logPlaylistCues in player.js. -->
        <label class="toggle" title="Writes the stream's ad-break markers (SCTE-35 cues, in the playlist or inside the video) to the log. Read them with Copy log."><input id="cue-log" type="checkbox"> Log ad-break cues (SCTE-35)</label>
        <!-- The picture-based detector: detector.js, detector-worker.js, detector-core.js. -->
        <label class="toggle" title="About twice a second, looks at a small copy of the big picture for the scorebug and the network logo, off the main thread. A break is called only when both are gone."><input id="detect-on" type="checkbox"> Watch the picture for the scorebug and network logo</label>
        <!-- Only shown while the detector is on. -->
        <div id="detect-options" class="detect" hidden>
        <label class="toggle" title="Green: on screen. Red, dashed: gone. Grey: taken for the site's watermark and ignored."><input id="detect-draw" type="checkbox"> Draw boxes around what it finds</label>
        <label class="toggle" title="Bottom right: how much of the picture is this game's field now, and how much it is in play. Green while it counts as the field being on screen (a replay, not a break, if the overlays go)."><input id="detect-field" type="checkbox"> Show the field share (🌱 %)</label>
        <label class="toggle" title="Writes is_commercial changes, with why, to the box at the top left and to Copy log"><input id="detect-log" type="checkbox"> Log commercial breaks (is_commercial), with why</label>
        <label class="inline">Call a break once both are gone for
          <select id="detect-missing">
            <option value="2">2 s</option>
            <option value="3">3 s</option>
            <option value="4" selected>4 s</option>
            <option value="6">6 s</option>
            <option value="10">10 s</option>
          </select>
        </label>
        <div class="actions">
          <button id="detect-relearn" type="button" title="Press during normal play: the detector needs about 30 seconds of the game with the scorebug and the network logo on screen. Not during a commercial, a replay or halftime.">Learn scorebug &amp; logo</button>
        </div>
        <p id="detect-status" class="muted small"></p>
        </div>
      </div>
    </details>
    <!-- Casting stays in view: it's what the menu is opened for most. -->
    <div id="cast">
      <p class="muted small">Cast via relay (beta)</p>
      <div class="actions">
        <button id="relay" type="button" title="Experimental: needs the relay running (node relay/server.mjs)">Start casting</button>
        <button id="fit-tv" type="button" title="For Chrome's own Cast (Chrome menu → Cast): resizes this window so the tab is 16:9 and fills the TV">Fit to TV</button>
      </div>
      <p id="fit-status" class="muted small"></p>
      <p id="cast-status" class="muted small"></p>
      <!-- The relay's cast page. It can load Google's Cast SDK, which extension pages can't. -->
      <iframe id="cast-frame" hidden title="Cast controls"></iframe>
    </div>
    <!-- Freezes, stalls, errors and retries, kept across reloads (see the freeze log in player.js). -->
    <div class="actions">
      <button id="copy-log" type="button" title="Copies what happened to the streams (freezes, errors, retries), to paste into a bug report">Copy log</button>
    </div>
    <p id="log-status" class="muted small"></p>
    <!-- Folds away; the player remembers whether it was left open. -->
    <details id="play-url" open>
      <summary class="muted small">Play a URL on the big screen</summary>
      <form id="form">
        <label>Stream URL <input name="url" type="url" required placeholder="https://…/index.m3u8"></label>
        <label>Referer <input name="referer" type="url" placeholder="https://embed-site/ (optional)"></label>
        <label>Origin <input name="origin" type="url" placeholder="https://embed-site (optional)"></label>
        <button type="submit">Play</button>
      </form>
    </details>
  </div>
  <script src="vendor/hls.min.js"></script>
  <script src="disguise.js"></script>
  <script src="shared.js"></script>
  <script src="mirror.js"></script>
  <script src="scte35.js"></script>
  <script src="detector-core.js"></script>
  <script src="detector.js"></script>
  <script src="player.js"></script>
</body>
</html>
